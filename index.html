<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KiraKira Cosplay - Nơi Để AE Giải Tỏa</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --primary: #00e5ff;
            --card-bg: rgba(20, 20, 25, 0.6);
            --text: #ffffff;
        }
        
        body {
            margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text);
            background: linear-gradient(-45deg, #090a0f, #1a1a2e, #0f3460, #16213e);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh; display: flex; flex-direction: column;
        }

        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes neonPulse { 0%, 100% { text-shadow: 0 0 10px var(--primary), 0 0 20px var(--primary); } 50% { text-shadow: 0 0 20px var(--primary), 0 0 40px var(--primary), 0 0 60px var(--primary); } }

        header { text-align: center; padding: 50px 20px 20px; }
        header h1 { font-size: 3.5rem; margin: 0; text-transform: uppercase; letter-spacing: 4px; color: var(--text); animation: neonPulse 2s infinite; }
        header p { color: #00e5ff; font-size: 1.2rem; margin-top: 10px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; }

        .search-container { text-align: center; margin: 20px auto 40px; width: 100%; max-width: 500px; padding: 0 20px; box-sizing: border-box; }
        .search-box {
            width: 100%; padding: 12px 25px; border-radius: 30px; border: 2px solid rgba(0, 229, 255, 0.3);
            background: rgba(0, 0, 0, 0.5); color: white; font-size: 1.1rem; outline: none; transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .search-box:focus { border-color: var(--primary); box-shadow: 0 0 20px rgba(0, 229, 255, 0.4); }

        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; padding: 0 50px 50px; max-width: 1200px; margin: 0 auto; flex-grow: 1; }

        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }

        .card {
            background-color: var(--card-bg); border-radius: 12px; overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease; cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5); text-decoration: none; backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column;
            opacity: 0; transform: translateY(30px); animation: fadeInUp 0.6s ease forwards;
        }
        .card:hover { transform: translateY(-8px); box-shadow: 0 12px 25px rgba(0, 229, 255, 0.3); border-color: rgba(0, 229, 255, 0.5); }
        
        .img-container { width: 100%; height: 380px; overflow: hidden; border-bottom: 2px solid var(--primary); background: #000; position: relative;}
        .card-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
        .card:hover .card-img { transform: scale(1.08); }

        .card-info { padding: 15px; display: flex; flex-direction: column; justify-content: space-between; flex-grow: 1; text-align: center; }
        .card-title { font-size: 1.1rem; font-weight: bold; color: var(--text); margin-bottom: 15px; }

        .btn-watch {
            display: inline-block; background-color: transparent; color: var(--primary);
            border: 2px solid var(--primary); padding: 10px 20px; border-radius: 25px;
            font-weight: bold; text-transform: uppercase; font-size: 0.9rem; transition: all 0.3s ease;
        }
        .card:hover .btn-watch { background-color: var(--primary); color: #000; box-shadow: 0 0 15px var(--primary); }

        #loading { text-align: center; padding: 50px; font-size: 1.5rem; color: var(--primary); text-shadow: 0 0 10px var(--primary); }

        footer { text-align: center; padding: 20px; background: rgba(0, 0, 0, 0.6); border-top: 1px solid rgba(0, 229, 255, 0.2); font-size: 0.9rem; color: #aaa; margin-top: auto; }
        footer span { color: var(--primary); font-weight: bold; }

        #scrollTopBtn { display: none; position: fixed; bottom: 30px; right: 30px; z-index: 99; background-color: var(--primary); color: #000; font-size: 20px; border: none; outline: none; cursor: pointer; padding: 15px; border-radius: 50%; box-shadow: 0 0 15px var(--primary); transition: 0.3s; width: 50px; height: 50px; text-align: center; line-height: 20px; }
        #scrollTopBtn:hover { background-color: #fff; transform: scale(1.1); }

        @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        #popup-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; display: flex; justify-content: center; align-items: center; transition: opacity 0.3s ease; }
        .popup-content { background: rgba(15, 15, 20, 0.95); border: 2px solid var(--primary); border-radius: 15px; padding: 20px; text-align: center; position: relative; max-width: 90%; width: 350px; box-shadow: 0 0 30px rgba(0, 229, 255, 0.3); animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .close-btn { position: absolute; top: -5px; right: 10px; font-size: 35px; color: #fff; cursor: pointer; transition: 0.2s; }
        .close-btn:hover { color: #ff0055; transform: scale(1.2); }
        .popup-img { width: 100%; border-radius: 10px; margin-bottom: 10px; object-fit: contain; max-height: 250px; }
        .popup-content h3 { color: var(--primary); margin: 10px 0; text-transform: uppercase; }
        .popup-content p { font-size: 0.95rem; color: #ccc; margin-bottom: 0; }
    </style>
</head>
<body>
    
    <div id="popup-overlay">
        <div class="popup-content">
            <span class="close-btn" onclick="closePopup()">&times;</span>
            <img src="https://i.postimg.cc/RFnq2cJM/315c2199-764b-4a62-b467-99c3a42ad7e9.png" alt="Thông báo" class="popup-img">
            <h3>Chào mừng AE!</h3>
            <p>Chúc anh em có những phút giây giải tỏa vui vẻ tại KiraKira. Đừng quên click xem video nhé!</p>
        </div>
    </div>

    <button onclick="scrollToTop()" id="scrollTopBtn" title="Lên đầu trang">↑</button>

    <header>
        <h1>KiraKira Cosplay</h1>
        <p>NƠI ĐỂ AE GIẢI TỎA</p>
    </header>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 Nhập tên video để tìm kiếm...">
    </div>

    <div id="loading">Đang tải dữ liệu, ae chờ chút nhé...</div>
    <div id="video-gallery" class="gallery"></div>

    <footer>
        &copy; 2026 <span>KiraKira Cosplay</span>. Tất cả các quyền được bảo lưu.
    </footer>

    <script>
        function closePopup() {
            document.getElementById('popup-overlay').style.opacity = '0';
            setTimeout(() => { document.getElementById('popup-overlay').style.display = 'none'; }, 300); 
        }

        const GOOGLE_SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRAb1YZ1F5eH0CM5u7CGph-4qmgZoVjXf5QvWX90T-1sjhggBM7SM0ROCmpJYontZv8UxXDccsAKzGW/pub?gid=0&single=true&output=csv';
        const adLinks = [
            "https://vt.tiktok.com/ZS9h36wYouDLb-ojzE1/",
            "https://vt.tiktok.com/ZS9hwC35QqF5E-27I2e/",
            "https://cheaplyregainthrift.com/kjwmjr2cc?key=bc9968dfe3a9f785791ad84123aa77de",
            "https://cheaplyregainthrift.com/dv3xs68de?key=877289809972cac42e2b995f1b380545",
            "https://vnvip.eastasia.cloudapp.azure.com/j3wgo"
        ];
        let currentAdIndex = 0;

        window.onload = function() {
            Papa.parse(GOOGLE_SHEET_CSV_URL, {
                download: true,
                header: true,
                complete: function(results) {
                    const data = results.data;
                    const gallery = document.getElementById('video-gallery');
                    document.getElementById('loading').style.display = 'none';
                    let cardIndex = 0; 

                    data.forEach(item => {
                        if(item['Tên Video'] && item['Link Ảnh Bìa'] && item['Link Video']) {
                            
                            const card = document.createElement('a');
                            card.className = 'card video-card'; 
                            card.href = item['Link Video'];
                            card.target = '_blank'; 
                            card.style.animationDelay = `${cardIndex * 0.1}s`;
                            cardIndex++;
                            
                            card.dataset.adClicked = "false"; 
                            card.addEventListener('click', function(event) {
                                if (this.dataset.adClicked === "false") {
                                    event.preventDefault(); 
                                    let adUrl = adLinks[currentAdIndex];
                                    window.open(adUrl, '_blank');
                                    currentAdIndex = (currentAdIndex + 1) % adLinks.length;
                                    this.dataset.adClicked = "true"; 
                                }
                            });

                            const imgContainer = document.createElement('div');
                            imgContainer.className = 'img-container';
                            const img = document.createElement('img');
                            img.className = 'card-img';
                            img.alt = item['Tên Video'];

                            let imageSource = item['Link Ảnh Bìa'];

                            // === PHIÊN BẢN VƯỢT RÀO TIKTOK V2 (MẠNH HƠN) ===
                            if(imageSource.includes('tiktok.com')) {
                                img.src = 'https://placehold.co/400x600/0f3460/00e5ff?text=Đang+Lấy+Ảnh\\nTikTok...';
                                
                                // Sử dụng API TikWM chuyên dụng để xử lý cả link vt.tiktok
                                let apiUrl = `https://www.tikwm.com/api/?url=${encodeURIComponent(imageSource)}`;
                                
                                fetch(apiUrl)
                                    .then(res => res.json())
                                    .then(apiData => {
                                        // Kiểm tra xem API có bóc thành công không
                                        if(apiData && apiData.code === 0 && apiData.data && apiData.data.cover) {
                                            // Ưu tiên lấy ảnh origin_cover (nét nhất), nếu không có thì lấy cover thường
                                            img.src = apiData.data.origin_cover || apiData.data.cover;
                                        } else {
                                            img.src = 'https://placehold.co/400x600/16213e/ff0055?text=Video+Lỗi+hoặc\\nBị+Xóa';
                                        }
                                    })
                                    .catch(err => {
                                        img.src = 'https://placehold.co/400x600/16213e/ff0055?text=Lỗi+Máy+Chủ';
                                    });
                            } else {
                                img.src = imageSource;
                                img.onerror = function() {
                                    this.src = 'https://placehold.co/400x600/16213e/ff0055?text=Lỗi+Tải+Ảnh';
                                };
                            }
                            // ===============================================

                            imgContainer.appendChild(img);

                            const infoContainer = document.createElement('div');
                            infoContainer.className = 'card-info';
                            const title = document.createElement('div');
                            title.className = 'card-title';
                            title.textContent = item['Tên Video'];

                            const btnWatch = document.createElement('div');
                            btnWatch.className = 'btn-watch';
                            btnWatch.textContent = '▶ Xem Video';

                            infoContainer.appendChild(title);
                            infoContainer.appendChild(btnWatch);

                            card.appendChild(imgContainer);
                            card.appendChild(infoContainer);
                            gallery.appendChild(card);
                        }
                    });
                }
            });
        }

        // TÌM KIẾM
        document.getElementById('searchInput').addEventListener('keyup', function() {
            let filter = this.value.toLowerCase();
            let cards = document.querySelectorAll('.video-card');
            cards.forEach(card => {
                let title = card.querySelector('.card-title').textContent.toLowerCase();
                if(title.indexOf(filter) > -1) { card.style.display = 'flex'; } 
                else { card.style.display = 'none'; }
            });
        });

        // NÚT CUỘN LÊN ĐẦU
        window.onscroll = function() {
            let btn = document.getElementById("scrollTopBtn");
            if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
                btn.style.display = "block";
            } else { btn.style.display = "none"; }
        };
        function scrollToTop() { window.scrollTo({top: 0, behavior: 'smooth'}); }
    </script>
</body>
</html>
