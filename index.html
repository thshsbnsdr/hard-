<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CosplayVerse - Anime Cosplay Gallery</title>
    <!-- Dùng thư viện PapaParse để đọc file CSV từ Google Sheet dễ dàng hơn -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --primary: #ff007f;
            --bg-color: #0f0f13;
            --card-bg: #1c1c24;
            --text: #ffffff;
        }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
        }
        header {
            text-align: center;
            padding: 50px 20px;
            background: linear-gradient(180deg, rgba(255,0,127,0.2) 0%, var(--bg-color) 100%);
        }
        header h1 {
            font-size: 3rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--primary);
            text-shadow: 0 0 15px var(--primary);
        }
        header p {
            color: #aaa;
            font-size: 1.2rem;
        }
        /* Grid chứa video */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            padding: 20px 50px;
            max-width: 1200px;
            margin: 0 auto;
        }
        /* Card thiết kế xịn sò */
        .card {
            background-color: var(--card-bg);
            border-radius: 15px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            text-decoration: none; /* Bỏ gạch chân link */
        }
        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(255,0,127,0.3);
        }
        .card-img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-bottom: 2px solid var(--primary);
        }
        .card-title {
            padding: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--text);
            text-align: center;
        }
        /* Màn hình loading */
        #loading {
            text-align: center;
            padding: 50px;
            font-size: 1.5rem;
            color: var(--primary);
        }
    </style>
</head>
<body>

    <header>
        <h1>CosplayVerse</h1>
        <p>Thế Giới Anime Cosplay Trong Tầm Tay Bạn</p>
    </header>

    <div id="loading">Đang tải dữ liệu từ Google Sheets...</div>
    <div id="video-gallery" class="gallery">
        <!-- Dữ liệu từ Google Sheet sẽ được đẩy vào đây -->
    </div>

    <script>
        // === BẠN HÃY DÁN LINK GOOGLE SHEET (ĐUÔI CSV) VÀO ĐÂY ===
        const GOOGLE_SHEET_CSV_URL = 'DÁN_LINK_CSV_CỦA_BẠN_VÀO_ĐÂY';

        function loadData() {
            Papa.parse(GOOGLE_SHEET_CSV_URL, {
                download: true,
                header: true,
                complete: function(results) {
                    const data = results.data;
                    const gallery = document.getElementById('video-gallery');
                    document.getElementById('loading').style.display = 'none';

                    data.forEach(item => {
                        // Kiểm tra nếu dòng có dữ liệu mới hiển thị
                        if(item['Tên Video'] && item['Link Ảnh Bìa'] && item['Link Video']) {
                            // Tạo thẻ a chứa video
                            const card = document.createElement('a');
                            card.className = 'card';
                            card.href = item['Link Video'];
                            card.target = '_blank'; // Mở video ở tab mới

                            // Tạo ảnh bìa
                            const img = document.createElement('img');
                            img.className = 'card-img';
                            img.src = item['Link Ảnh Bìa'];
                            img.alt = item['Tên Video'];

                            // Tạo tiêu đề
                            const title = document.createElement('div');
                            title.className = 'card-title';
                            title.textContent = item['Tên Video'];

                            // Ghép vào card
                            card.appendChild(img);
                            card.appendChild(title);
                            gallery.appendChild(card);
                        }
                    });
                }
            });
        }

        // Chạy hàm khi trang web tải xong
        window.onload = loadData;
    </script>
</body>
</html>
