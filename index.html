<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KiraKira Cosplay - Nơi Để AE Giải Tỏa</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --primary: #00e5ff;
            --card-bg: rgba(20, 20, 25, 0.85);
            --text: #ffffff;
        }
        
        /* === HỆ THỐNG HÌNH NỀN ÉP CỨNG (SỬA LỖI PC HIỆN NỀN MOBILE) === */
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text);
            overflow-x: hidden;
            
            /* Mặc định lấy ảnh DỌC cho ĐIỆN THOẠI */
            background-image: url('https://i.postimg.cc/ZqYZf0PJ/snapedit-1789566091564.jpg'); 
        }

        /* ÉP CỨNG: Nếu màn hình lớn hơn 768px (MÁY TÍNH / LAPTOP) thì CHẮC CHẮN dùng ảnh NGANG */
        @media (min-width: 769px) {
            body {
                background-image: url('https://i.postimg.cc/d0YTzXtY/images.jpg') !important; 
            }
        }
        /* ==================================== */

        .overlay {
            background-color: rgba(0, 0, 0, 0.6);
            min-height: 100vh;
            padding-bottom: 50px;
        }

        @keyframes neonPulse {
            0%, 100% { text-shadow: 0 0 10px var(--primary), 0 0 20px var(--primary); }
            50% { text-shadow: 0 0 20px var(--primary), 0 0 40px var(--primary), 0 0 60px var(--primary); }
        }

        header { text-align: center; padding: 60px 20px 40px; }
        header h1 {
            font-size: 3.5rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--text);
            animation: neonPulse 2s infinite; 
        }
        header p {
            color: #00e5ff; font-size: 1.3rem; margin-top: 10px;
            font-weight: bold; letter-spacing: 2px; text-transform: uppercase;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            padding: 20px 50px;
            max-width: 1200px;
            margin: 0 auto;
        }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
            text-decoration: none;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(0, 229, 255, 0.2);
            display: flex;
            flex-direction: column;
            opacity: 0; 
            transform: translateY(30px);
            animation: fadeInUp 0.6s ease forwards;
        }
        .card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 12px 25px rgba(0, 229, 255, 0.5);
            border-color: var(--primary);
        }
        
        .img-container { width: 100%; height: 380px; overflow: hidden; border-bottom: 2px solid var(--primary); }
        .card-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
        .card:hover .card-img { transform: scale(1.08); }

        .card-info { padding: 15px; display: flex; flex-direction: column; justify-content: space-between; flex-grow: 1; text-align: center; }
        .card-title { font-size: 1.1rem; font-weight: bold; color: var(--text); margin-bottom: 15px; }

        .btn-watch {
            display: inline-block; background-color: transparent; color: var(--primary);
            border: 2px solid var(--primary); padding: 10px 20px; border-radius: 25px;
            font-weight: bold; text-transform: uppercase; font-size: 0.9rem;
            transition: all 0.3s ease; box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
        }
        .card:hover .btn-watch { background-color: var(--primary); color: #000; box-shadow: 0 0 15px var(--primary); }

        #loading { text-align: center; padding: 50px; font-size: 1.5rem; color: var(--primary); text-shadow: 0 0 10px var(--primary); }

        /* === POPUP THÔNG BÁO === */
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        #popup-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 9999;
            display: flex; justify-content: center; align-items: center;
            transition: opacity 0.3s ease;
        }
        .popup-content {
            background: rgba(20, 20, 25, 0.95);
            border: 2px solid var(--primary); border-radius: 15px;
            padding: 20px; text-align: center; position: relative;
            max-width: 90%; width: 350px;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.5);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(10px);
        }
        .close-btn {
            position: absolute; top: -5px; right: 10px;
            font-size: 35px; color: #fff; cursor: pointer; font-weight: bold; transition: 0.2s;
        }
        .close-btn:hover { color: #ff0055; transform: scale(1.2); }
        .popup-img { width: 100%; border-radius: 10px; margin-bottom: 10px; object-fit: contain; max-height: 250px; }
        .popup-content h3 { color: var(--primary); margin: 10px 0; text-transform: uppercase; }
        .popup-content p { font-size: 0.95rem; color: #ccc; margin-bottom: 0; }
    </style>
</head>
<body>
    
    <!-- KHUNG POPUP THÔNG BÁO -->
    <div id="popup-overlay">
        <div class="popup-content">
            <span class="close-btn" onclick="closePopup()">&times;</span>
            <!-- ẢNH THÔNG BÁO MỚI ĐÃ ĐƯỢC CẬP NHẬT TẠI ĐÂY -->
            <img src="https://i.postimg.cc/RFnq2cJM/315c2199-764b-4a62-b467-99c3a42ad7e9.png" alt="Thông báo" class="popup-img">
            <h3>Chào mừng AE!</h3>
            <p>Chúc anh em có những phút giây giải tỏa vui vẻ tại KiraKira. Đừng quên click xem video nhé!</p>
        </div>
    </div>

    <div class="overlay">
        <header>
            <h1>KiraKira Cosplay</h1>
            <p>NƠI ĐỂ AE GIẢI TỎA</p>
        </header>

        <div id="loading">Đang tải dữ liệu, ae chờ chút nhé...</div>
        <div id="video-gallery" class="gallery"></div>
    </div>

    <script>
        function closePopup() {
            document.getElementById('popup-overlay').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('popup-overlay').style.display = 'none';
            }, 300); 
        }

        const GOOGLE_SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRAb1YZ1F5eH0CM5u7CGph-4qmgZoVjXf5QvWX90T-1sjhggBM7SM0ROCmpJYontZv8UxXDccsAKzGW/pub?gid=0&single=true&output=csv';

        const adLinks = [
            "https://vt.tiktok.com/ZS9h36wYouDLb-ojzE1/",
            "https://vt.tiktok.com/ZS9hwC35QqF5E-27I2e/",
            "https://cheaplyregainthrift.com/kjwmjr2cc?key=bc9968dfe3a9f785791ad84123aa77de",
            "https://cheaplyregainthrift.com/dv3xs68de?key=877289809972cac42e2b995f1b380545",
            "https://vnvip.eastasia.cloudapp.azure.com/j3wgo"
        ];
        
        let currentAdIndex = 0;

        window.onload = function() {
            Papa.parse(GOOGLE_SHEET_CSV_URL, {
                download: true,
                header: true,
                complete: function(results) {
                    const data = results.data;
                    const gallery = document.getElementById('video-gallery');
                    document.getElementById('loading').style.display = 'none';
                    
                    let cardIndex = 0; 

                    data.forEach(item => {
                        if(item['Tên Video'] && item['Link Ảnh Bìa'] && item['Link Video']) {
                            
                            const card = document.createElement('a');
                            card.className = 'card';
                            card.href = item['Link Video'];
                            card.target = '_blank'; 
                            
                            card.style.animationDelay = `${cardIndex * 0.1}s`;
                            cardIndex++;
                            
                            card.dataset.adClicked = "false"; 
                            card.addEventListener('click', function(event) {
                                if (this.dataset.adClicked === "false") {
                                    event.preventDefault(); 
                                    let adUrl = adLinks[currentAdIndex];
                                    window.open(adUrl, '_blank');
                                    currentAdIndex = (currentAdIndex + 1) % adLinks.length;
                                    this.dataset.adClicked = "true"; 
                                }
                            });

                            const imgContainer = document.createElement('div');
                            imgContainer.className = 'img-container';
                            const img = document.createElement('img');
                            img.className = 'card-img';
                            img.src = item['Link Ảnh Bìa'];
                            img.alt = item['Tên Video'];
                            imgContainer.appendChild(img);

                            const infoContainer = document.createElement('div');
                            infoContainer.className = 'card-info';
                            const title = document.createElement('div');
                            title.className = 'card-title';
                            title.textContent = item['Tên Video'];

                            const btnWatch = document.createElement('div');
                            btnWatch.className = 'btn-watch';
                            btnWatch.textContent = '▶ Xem Video';

                            infoContainer.appendChild(title);
                            infoContainer.appendChild(btnWatch);

                            card.appendChild(imgContainer);
                            card.appendChild(infoContainer);
                            gallery.appendChild(card);
                        }
                    });
                },
                error: function(err) {
                    document.getElementById('loading').textContent = 'Oops! Lỗi không tải được dữ liệu...';
                }
            });
        }
    </script>
</body>
</html>
