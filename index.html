<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KiraKira Cosplay - Thế Giới Anime</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            /* Màu chủ đạo xanh neon */
            --primary: #00e5ff; 
            --card-bg: rgba(20, 20, 25, 0.85);
            --text: #ffffff;
        }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* === ẢNH NỀN BẠN YÊU CẦU ĐÃ ĐƯỢC THÊM VÀO ĐÂY === */
            background-image: url('https://i.postimg.cc/ZqYZf0PJ/snapedit-1789566091564.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text);
        }
        /* Lớp phủ làm tối ảnh nền một chút để chữ dễ đọc hơn */
        .overlay {
            background-color: rgba(0, 0, 0, 0.6);
            min-height: 100vh;
            padding-bottom: 50px;
        }
        header {
            text-align: center;
            padding: 60px 20px 40px;
        }
        header h1 {
            font-size: 3.5rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--text);
            text-shadow: 0 0 10px var(--primary), 0 0 20px var(--primary);
        }
        header p {
            color: #00e5ff;
            font-size: 1.3rem;
            margin-top: 10px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            padding: 20px 50px;
            max-width: 1200px;
            margin: 0 auto;
        }
        /* Giao diện thẻ video (Card) */
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
            text-decoration: none;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(0, 229, 255, 0.2);
            display: flex;
            flex-direction: column;
        }
        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 25px rgba(0, 229, 255, 0.5);
            border-color: var(--primary);
        }
        /* ==================================================
           GIẢI QUYẾT VẤN ĐỀ ẢNH (KHÔNG CÒN VIỀN ĐEN LỚN)
           ================================================== */
        .img-container {
            width: 100%;
            height: 380px; /* Tăng chiều cao lên một chút cho hợp với ảnh cosplay dọc */
            overflow: hidden;
            border-bottom: 2px solid var(--primary);
        }
        .card-img {
            width: 100%;
            height: 100%;
            /* Thay đổi thành cover để lấp đầy khung hình, không bị viền đen */
            object-fit: cover; 
            transition: transform 0.5s ease;
        }
        .card:hover .card-img {
            transform: scale(1.05); /* Hiệu ứng zoom nhẹ ảnh khi di chuột vào siêu xịn */
        }
        /* ================================================== */
        .card-title {
            padding: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--text);
            text-align: center;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #loading {
            text-align: center;
            padding: 50px;
            font-size: 1.5rem;
            color: var(--primary);
            text-shadow: 0 0 10px var(--primary);
        }
    </style>
</head>
<body>
    <div class="overlay">
        <header>
            <h1>KiraKira Cosplay</h1>
            <!-- CÂU SLOGAN ĐÃ ĐƯỢC ĐỔI Ở ĐÂY -->
            <p>NƠI ĐỂ AE GIẢI TỎA</p>
        </header>

        <div id="loading">Đang tải dữ liệu, ae chờ chút nhé...</div>
        <div id="video-gallery" class="gallery"></div>
    </div>

    <script>
        const GOOGLE_SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRAb1YZ1F5eH0CM5u7CGph-4qmgZoVjXf5QvWX90T-1sjhggBM7SM0ROCmpJYontZv8UxXDccsAKzGW/pub?gid=0&single=true&output=csv';

        window.onload = function() {
            Papa.parse(GOOGLE_SHEET_CSV_URL, {
                download: true,
                header: true,
                complete: function(results) {
                    const data = results.data;
                    const gallery = document.getElementById('video-gallery');
                    document.getElementById('loading').style.display = 'none';

                    data.forEach(item => {
                        if(item['Tên Video'] && item['Link Ảnh Bìa'] && item['Link Video']) {
                            const card = document.createElement('a');
                            card.className = 'card';
                            card.href = item['Link Video'];
                            card.target = '_blank';

                            const imgContainer = document.createElement('div');
                            imgContainer.className = 'img-container';

                            const img = document.createElement('img');
                            img.className = 'card-img';
                            img.src = item['Link Ảnh Bìa'];
                            img.alt = item['Tên Video'];

                            const title = document.createElement('div');
                            title.className = 'card-title';
                            title.textContent = item['Tên Video'];

                            imgContainer.appendChild(img);
                            card.appendChild(imgContainer);
                            card.appendChild(title);
                            gallery.appendChild(card);
                        }
                    });
                },
                error: function(err) {
                    document.getElementById('loading').textContent = 'Oops! Lỗi không tải được dữ liệu, vui lòng kiểm tra lại link Google Sheet.';
                }
            });
        }
    </script>
</body>
</html>
