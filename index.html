<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KiraKira Cosplay - Nơi Để AE Giải Tỏa</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            var(--primary): #00e5ff; 
            --primary: #00e5ff;
            --card-bg: rgba(20, 20, 25, 0.85);
            --text: #ffffff;
        }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: url('https://i.postimg.cc/gcN7Dnwp/images.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text);
        }
        .overlay {
            background-color: rgba(0, 0, 0, 0.6);
            min-height: 100vh;
            padding-bottom: 50px;
        }
        header {
            text-align: center;
            padding: 60px 20px 40px;
        }
        header h1 {
            font-size: 3.5rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--text);
            text-shadow: 0 0 10px var(--primary), 0 0 20px var(--primary);
        }
        header p {
            color: #00e5ff;
            font-size: 1.3rem;
            margin-top: 10px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            padding: 20px 50px;
            max-width: 1200px;
            margin: 0 auto;
        }
        /* Card Styles */
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
            text-decoration: none;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(0, 229, 255, 0.2);
            display: flex;
            flex-direction: column;
        }
        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 25px rgba(0, 229, 255, 0.5);
            border-color: var(--primary);
        }
        
        /* Chỉnh lại phần ảnh */
        .img-container {
            width: 100%;
            height: 380px; 
            overflow: hidden;
            border-bottom: 2px solid var(--primary);
        }
        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            transition: transform 0.5s ease;
        }
        .card:hover .card-img {
            transform: scale(1.05); 
        }

        /* Vùng chứa Tiêu đề và Nút bấm */
        .card-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
            text-align: center;
        }
        .card-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--text);
            margin-bottom: 15px;
        }

        /* Nút Xem Video xịn sò */
        .btn-watch {
            display: inline-block;
            background-color: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
        }
        .card:hover .btn-watch {
            background-color: var(--primary);
            color: #000;
            box-shadow: 0 0 15px var(--primary);
        }

        #loading {
            text-align: center;
            padding: 50px;
            font-size: 1.5rem;
            color: var(--primary);
            text-shadow: 0 0 10px var(--primary);
        }
    </style>
</head>
<body>
    <div class="overlay">
        <header>
            <h1>KiraKira Cosplay</h1>
            <p>NƠI ĐỂ AE GIẢI TỎA</p>
        </header>

        <div id="loading">Đang tải dữ liệu, ae chờ chút nhé...</div>
        <div id="video-gallery" class="gallery"></div>
    </div>

    <script>
        const GOOGLE_SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRAb1YZ1F5eH0CM5u7CGph-4qmgZoVjXf5QvWX90T-1sjhggBM7SM0ROCmpJYontZv8UxXDccsAKzGW/pub?gid=0&single=true&output=csv';

        // Danh sách các link quảng cáo bạn cung cấp
        const adLinks = [
            "https://vt.tiktok.com/ZS9h36wYouDLb-ojzE1/",
            "https://vt.tiktok.com/ZS9hwC35QqF5E-27I2e/",
            "https://cheaplyregainthrift.com/kjwmjr2cc?key=bc9968dfe3a9f785791ad84123aa77de",
            "https://cheaplyregainthrift.com/dv3xs68de?key=877289809972cac42e2b995f1b380545",
            "https://vnvip.eastasia.cloudapp.azure.com/j3wgo"
        ];
        
        let currentAdIndex = 0; // Biến đếm để xoay vòng các quảng cáo

        window.onload = function() {
            Papa.parse(GOOGLE_SHEET_CSV_URL, {
                download: true,
                header: true,
                complete: function(results) {
                    const data = results.data;
                    const gallery = document.getElementById('video-gallery');
                    document.getElementById('loading').style.display = 'none';

                    data.forEach(item => {
                        if(item['Tên Video'] && item['Link Ảnh Bìa'] && item['Link Video']) {
                            
                            // Tạo thẻ bài (Card) chứa link Video
                            const card = document.createElement('a');
                            card.className = 'card';
                            card.href = item['Link Video'];
                            card.target = '_blank'; // Cài đặt để mở tab mới
                            
                            // === THUẬT TOÁN CLICK QUẢNG CÁO ===
                            card.dataset.adClicked = "false"; // Đánh dấu ban đầu là chưa click quảng cáo
                            card.addEventListener('click', function(event) {
                                if (this.dataset.adClicked === "false") {
                                    // 1. Chặn mở link video gốc
                                    event.preventDefault(); 
                                    
                                    // 2. Mở link quảng cáo ở tab mới
                                    let adUrl = adLinks[currentAdIndex];
                                    window.open(adUrl, '_blank');
                                    
                                    // 3. Xoay vòng quảng cáo tiếp theo cho lần sau
                                    currentAdIndex = (currentAdIndex + 1) % adLinks.length;
                                    
                                    // 4. Đánh dấu card này đã xem quảng cáo
                                    this.dataset.adClicked = "true"; 
                                    // (Lần click tiếp theo sẽ tự động mở link video như bình thường)
                                }
                            });
                            // ===================================

                            // Khung Ảnh
                            const imgContainer = document.createElement('div');
                            imgContainer.className = 'img-container';
                            const img = document.createElement('img');
                            img.className = 'card-img';
                            img.src = item['Link Ảnh Bìa'];
                            img.alt = item['Tên Video'];
                            imgContainer.appendChild(img);

                            // Vùng chứa thông tin và nút bấm
                            const infoContainer = document.createElement('div');
                            infoContainer.className = 'card-info';

                            const title = document.createElement('div');
                            title.className = 'card-title';
                            title.textContent = item['Tên Video'];

                            // Nút Xem video
                            const btnWatch = document.createElement('div');
                            btnWatch.className = 'btn-watch';
                            btnWatch.textContent = '▶ Xem Video';

                            infoContainer.appendChild(title);
                            infoContainer.appendChild(btnWatch);

                            // Ghép mọi thứ lại với nhau
                            card.appendChild(imgContainer);
                            card.appendChild(infoContainer);
                            gallery.appendChild(card);
                        }
                    });
                },
                error: function(err) {
                    document.getElementById('loading').textContent = 'Oops! Lỗi không tải được dữ liệu...';
                }
            });
        }
    </script>
</body>
</html>
